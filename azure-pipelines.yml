trigger:
  branches:
    include:
      - main

variables:
  acrName: bespokedacr
  acrLoginServer: bespokedacr.azurecr.io
  resourceGroup: bespoked-rg
  apiImageName: bespoked-api
  frontendImageName: bespoked-frontend

stages:
  - stage: Build
    jobs:
      - job: BuildAndPush
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: Docker@2
            displayName: Build and push API image
            inputs:
              command: buildAndPush
              containerRegistry: acr-bespoked
              repository: $(apiImageName)
              dockerfile: backend/Dockerfile
              buildContext: backend
              tags: |
                latest
                $(Build.BuildId)

          - task: Docker@2
            displayName: Build and push frontend image
            inputs:
              command: buildAndPush
              containerRegistry: acr-bespoked
              repository: $(frontendImageName)
              dockerfile: frontend/Dockerfile
              buildContext: frontend
              tags: |
                latest
                $(Build.BuildId)

  - stage: Deploy
    dependsOn: Build
    jobs:
      - job: DeployContainerApps
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: AzureCLI@2
            displayName: Create Container Apps Environment
            inputs:
              azureSubscription: azure-bespoked
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az extension add --name containerapp --upgrade -y
                az containerapp env create \
                  --name bespoked-env \
                  --resource-group $(resourceGroup) \
                  --location eastus 2>/dev/null || echo "Environment already exists"

          - task: AzureCLI@2
            displayName: Deploy API to Container Apps
            inputs:
              azureSubscription: azure-bespoked
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az containerapp create \
                  --name bespoked-api \
                  --resource-group $(resourceGroup) \
                  --environment bespoked-env \
                  --image $(acrLoginServer)/$(apiImageName):$(Build.BuildId) \
                  --registry-server $(acrLoginServer) \
                  --registry-identity system \
                  --target-port 8080 \
                  --ingress external \
                  --env-vars \
                    ConnectionStrings__DefaultConnection="Server=db,1433;Database=BeSpoked;User Id=sa;Password=BeSpoked123!;TrustServerCertificate=True;" \
                    ASPNETCORE_ENVIRONMENT=Development \
                  --query properties.configuration.ingress.fqdn \
                  --output tsv || \
                az containerapp update \
                  --name bespoked-api \
                  --resource-group $(resourceGroup) \
                  --image $(acrLoginServer)/$(apiImageName):$(Build.BuildId)

          - task: AzureCLI@2
            displayName: Deploy frontend to Container Apps
            inputs:
              azureSubscription: azure-bespoked
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az containerapp create \
                  --name bespoked-frontend \
                  --resource-group $(resourceGroup) \
                  --environment bespoked-env \
                  --image $(acrLoginServer)/$(frontendImageName):$(Build.BuildId) \
                  --registry-server $(acrLoginServer) \
                  --registry-identity system \
                  --target-port 80 \
                  --ingress external \
                  --query properties.configuration.ingress.fqdn \
                  --output tsv || \
                az containerapp update \
                  --name bespoked-frontend \
                  --resource-group $(resourceGroup) \
                  --image $(acrLoginServer)/$(frontendImageName):$(Build.BuildId)
