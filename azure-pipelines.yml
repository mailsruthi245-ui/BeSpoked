trigger:
  branches:
    include:
      - main

variables:
  acrName: bespokedacr
  acrLoginServer: bespokedacr.azurecr.io
  resourceGroup: bespoked-rg
  apiImageName: bespoked-api
  frontendImageName: bespoked-frontend

stages:
  - stage: Build
    jobs:
      - job: BuildAndPush
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: Docker@2
            displayName: Build and push API image
            inputs:
              command: buildAndPush
              containerRegistry: acr-bespoked
              repository: $(apiImageName)
              dockerfile: backend/Dockerfile
              buildContext: backend
              tags: |
                latest
                $(Build.BuildId)

          - task: Docker@2
            displayName: Build and push frontend image
            inputs:
              command: buildAndPush
              containerRegistry: acr-bespoked
              repository: $(frontendImageName)
              dockerfile: frontend/Dockerfile
              buildContext: frontend
              tags: |
                latest
                $(Build.BuildId)

  - stage: Deploy
    dependsOn: Build
    jobs:
      - job: DeployContainerApps
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: AzureCLI@2
            displayName: Create Container Apps Environment
            inputs:
              azureSubscription: azure-bespoked
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az extension add --name containerapp --upgrade -y
                if ! az containerapp env show --name bespoked-env --resource-group $(resourceGroup) &>/dev/null; then
                  az containerapp env create \
                    --name bespoked-env \
                    --resource-group $(resourceGroup) \
                    --location eastus \
                    --logs-destination none
                fi

          - task: AzureCLI@2
            displayName: Deploy API to Container Apps
            inputs:
              azureSubscription: azure-bespoked
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                if az containerapp show --name bespoked-api --resource-group $(resourceGroup) &>/dev/null; then
                  az containerapp update \
                    --name bespoked-api \
                    --resource-group $(resourceGroup) \
                    --image $(acrLoginServer)/$(apiImageName):$(Build.BuildId)
                else
                  az containerapp create \
                    --name bespoked-api \
                    --resource-group $(resourceGroup) \
                    --environment bespoked-env \
                    --image $(acrLoginServer)/$(apiImageName):$(Build.BuildId) \
                    --registry-server $(acrLoginServer) \
                    --registry-username $(acrName) \
                    --registry-password $(acrPassword) \
                    --target-port 8080 \
                    --ingress external \
                    --env-vars \
                      ConnectionStrings__DefaultConnection="Server=db,1433;Database=BeSpoked;User Id=sa;Password=BeSpoked123!;TrustServerCertificate=True;" \
                      ASPNETCORE_ENVIRONMENT=Development
                fi

          - task: AzureCLI@2
            displayName: Deploy frontend to Container Apps
            inputs:
              azureSubscription: azure-bespoked
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                if az containerapp show --name bespoked-frontend --resource-group $(resourceGroup) &>/dev/null; then
                  az containerapp update \
                    --name bespoked-frontend \
                    --resource-group $(resourceGroup) \
                    --image $(acrLoginServer)/$(frontendImageName):$(Build.BuildId)
                else
                  az containerapp create \
                    --name bespoked-frontend \
                    --resource-group $(resourceGroup) \
                    --environment bespoked-env \
                    --image $(acrLoginServer)/$(frontendImageName):$(Build.BuildId) \
                    --registry-server $(acrLoginServer) \
                    --registry-username $(acrName) \
                    --registry-password $(acrPassword) \
                    --target-port 80 \
                    --ingress external
                fi
