trigger:
  branches:
    include:
      - main

variables:
  acrName: bespokedacr
  acrLoginServer: bespokedacr.azurecr.io
  resourceGroup: bespoked-rg
  apiImageName: bespoked-api
  frontendImageName: bespoked-frontend
  apiUrl: https://bespoked-api.ambitiousfield-a26c3bb2.eastus.azurecontainerapps.io

stages:
  - stage: Build
    jobs:
      - job: BuildAndPush
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: Docker@2
            displayName: Build and push API image
            inputs:
              command: buildAndPush
              containerRegistry: acr-bespoked
              repository: $(apiImageName)
              dockerfile: backend/Dockerfile
              buildContext: backend
              tags: |
                latest
                $(Build.BuildId)

          - task: Docker@2
            displayName: Build and push frontend image
            inputs:
              command: buildAndPush
              containerRegistry: acr-bespoked
              repository: $(frontendImageName)
              dockerfile: frontend/Dockerfile
              buildContext: frontend
              tags: |
                latest
                $(Build.BuildId)

  - stage: Deploy
    dependsOn: Build
    jobs:
      - job: DeployContainerApps
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: AzureCLI@2
            displayName: Create Container Apps Environment
            inputs:
              azureSubscription: azure-bespoked
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az extension add --name containerapp --upgrade -y
                if ! az containerapp env show --name bespoked-env --resource-group $(resourceGroup) &>/dev/null; then
                  az containerapp env create \
                    --name bespoked-env \
                    --resource-group $(resourceGroup) \
                    --location eastus \
                    --logs-destination none
                fi

          - task: AzureCLI@2
            displayName: Deploy SQL Server to Container Apps
            inputs:
              azureSubscription: azure-bespoked
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                if ! az containerapp show --name bespoked-db --resource-group $(resourceGroup) &>/dev/null; then
                  az containerapp create \
                    --name bespoked-db \
                    --resource-group $(resourceGroup) \
                    --environment bespoked-env \
                    --image mcr.microsoft.com/mssql/server:2022-latest \
                    --target-port 1433 \
                    --ingress internal \
                    --transport tcp \
                    --cpu 1.0 \
                    --memory 2.0Gi \
                    --min-replicas 1 \
                    --max-replicas 1 \
                    --env-vars \
                      SA_PASSWORD="$(saPassword)" \
                      ACCEPT_EULA="Y" \
                      MSSQL_PID="Developer"
                fi

          - task: AzureCLI@2
            displayName: Deploy API to Container Apps
            inputs:
              azureSubscription: azure-bespoked
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                ACR_PASS=$(az acr credential show --name $(acrName) --query "passwords[0].value" -o tsv)
                if az containerapp show --name bespoked-api --resource-group $(resourceGroup) &>/dev/null; then
                  az containerapp registry set \
                    --name bespoked-api \
                    --resource-group $(resourceGroup) \
                    --server $(acrLoginServer) \
                    --username $(acrName) \
                    --password "$ACR_PASS"
                  az containerapp update \
                    --name bespoked-api \
                    --resource-group $(resourceGroup) \
                    --image $(acrLoginServer)/$(apiImageName):$(Build.BuildId) \
                    --set-env-vars \
                      ConnectionStrings__DefaultConnection="$(dbConnectionString)" \
                      ASPNETCORE_ENVIRONMENT=Development
                else
                  az containerapp create \
                    --name bespoked-api \
                    --resource-group $(resourceGroup) \
                    --environment bespoked-env \
                    --image $(acrLoginServer)/$(apiImageName):$(Build.BuildId) \
                    --registry-server $(acrLoginServer) \
                    --registry-username $(acrName) \
                    --registry-password "$ACR_PASS" \
                    --target-port 8080 \
                    --ingress external \
                    --env-vars \
                      ConnectionStrings__DefaultConnection="$(dbConnectionString)" \
                      ASPNETCORE_ENVIRONMENT=Development
                fi

          - task: AzureCLI@2
            displayName: Deploy frontend to Container Apps
            inputs:
              azureSubscription: azure-bespoked
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                ACR_PASS=$(az acr credential show --name $(acrName) --query "passwords[0].value" -o tsv)
                if az containerapp show --name bespoked-frontend --resource-group $(resourceGroup) &>/dev/null; then
                  az containerapp registry set \
                    --name bespoked-frontend \
                    --resource-group $(resourceGroup) \
                    --server $(acrLoginServer) \
                    --username $(acrName) \
                    --password "$ACR_PASS"
                  az containerapp update \
                    --name bespoked-frontend \
                    --resource-group $(resourceGroup) \
                    --image $(acrLoginServer)/$(frontendImageName):$(Build.BuildId) \
                    --set-env-vars API_URL=$(apiUrl)
                else
                  az containerapp create \
                    --name bespoked-frontend \
                    --resource-group $(resourceGroup) \
                    --environment bespoked-env \
                    --image $(acrLoginServer)/$(frontendImageName):$(Build.BuildId) \
                    --registry-server $(acrLoginServer) \
                    --registry-username $(acrName) \
                    --registry-password "$ACR_PASS" \
                    --target-port 80 \
                    --ingress external \
                    --env-vars API_URL=$(apiUrl)
                fi
